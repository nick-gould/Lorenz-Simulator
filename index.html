<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lorenz Simulation</title>
  <link rel="stylesheet" href="app.css">
  <script src="plotly-3.5.1.min.js" charset="utf-8"></script>
  <script src="pyodide.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <h2>Set Simulation Values</h2>
  Lorenz Explaination available on <a href="https://en.wikipedia.org/wiki/Lorenz_system", target="_blank">wikipedia</a>.<br><br>
  Note: If x is set to 0, the trace will never leave the origin<br><br>

  <div class="controls">
    <div class="control">
      <label for="slider_sigma">sigma</label>
      <input id="slider_sigma" type="range" min="0" max="20" step="0.1" value="10">
      <span id="val_sigma">10</span>
    </div>

    <div class="control">
      <label for="slider_rho">rho</label>
      <input id="slider_rho" type="range" min="0" max="100" step="0.1" value="28">
      <span id="val_rho">28</span>
    </div>

    <div class="control">
      <label for="slider_beta">beta</label>
      <input id="slider_beta" type="range" min="0" max="10" step="0.001" value="2.666">
      <span id="val_beta">2.666</span>
    </div>

    <div class="control">
      <label for="slider_x">x</label>
      <input id="slider_x" type="range" min="-10" max="10" step="0.1" value="1">
      <span id="val_x">1</span>
    </div>

    <div class="control">
      <label for="slider_y">y</label>
      <input id="slider_y" type="range" min="-10" max="10" step="0.1" value="0">
      <span id="val_y">0</span>
    </div>

    <div class="control">
      <label for="slider_z">z</label>
      <input id="slider_z" type="range" min="-10" max="10" step="0.1" value="0">
      <span id="val_z">0</span>
    </div>

    <div class="control">
      <label for="slider_dt">dt</label>
      <input id="slider_dt" type="range" min="0.001" max="1" step="0.001" value="0.01">
      <span id="val_dt">0.01</span>
    </div>

    <div class="control">
      <label for="slider_n">N (points)</label>
      <input id="slider_n" type="range" min="100" max="10000" step="100" value="2000">
      <span id="val_n">2000</span>
    </div>

    <button id="run">Run</button>
  </div>

  <div id="plot" style="width:100%;max-width:900px;height:600px;"></div>
  <pre id="py-output" style="background:#f7f7f7;padding:8px;display:none;"></pre>
</body>
</html>
